<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=divice-width, initial-scale=1.0" />
    <title>WeatherWise </title>
    <link rel="icon" href="./img//icon-web.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
    <script src="./js/script.js"></script>
</head>

<body>
    <div class="container">
        <!-- TOP Section -->
        <div class="top-section">
            <div class="location-info">
                <div class="date-location">
                    <p class="date">July 24, 2024</p>
                    <p class="location">Bangalore, India</p>
                </div>
                <p class="temperature">18°C</p>
            </div>
            <div class="weather-icon">
                <img style="width: 200px;"
                    src="./img/rainy girl.gif"
                    alt="Icon" />
            </div>
        </div>
        <!-- MIDDLE Section -->
        <div class="mid-section">
            <h1 class="day">WEDNESDAY</h1>
            <h4 class="status">Showers</h4>
        </div>
        <!-- END Section -->
        <div class="end-section">
            <button id="yesterday" class="arrow-left" style="padding-left: 2%;">‹ Yesterday</button>
            <div class="forecast-today">
                <p class="todayTxt">Today <br><span class="dotTxt">.</span></p>
                <div class="forecast-hours">
                    <div class="hour">
                        <p>6 AM</p>
                        <img src="./img/partly-sunny.png" />
                        <p>25°C</p>
                    </div>
                    <div class="hour active">
                        <p class="current-hour">2 PM</p>
                        <img src="./img/rainy.png" />
                        <p class="current-degree">18°C</p>
                    </div>
                    <div class="hour">
                        <p>4 PM</p>
                        <img src="./img/partly-sunny.png" />
                        <p>39°C</p>
                    </div>
                    <div class="hour">
                        <p>6 PM</p>
                        <img src="./img/partly-sunny.png" />
                        <p>36°C</p>
                    </div>
                    <div class="hour">
                        <p>8 PM</p>
                        <img src="./img/partly-sunny.png" />
                        <p>34°C</p>
                    </div>
                    <div class="hour">
                        <p>10 PM</p>
                        <img src="./img/partly-sunny.png" />
                        <p>34°C</p>
                    </div>
                    <div class="hour">
                        <p>12 PM</p>
                        <img src="./img/partly-sunny.png" />
                        <p>33°C</p>
                    </div>
                    <div class="hour">
                        <p>2 AM</p>
                        <img src="./img/partly-sunny.png" />
                        <p>32°C</p>
                    </div>
                    <div class="hour">
                        <p>4 AM</p>
                        <img src="./img/partly-sunny.png" />
                        <p>32°C</p>
                    </div>
                </div>
            </div>
            <button id="tomorrow" class="arrow-right" style="padding-right: 2%;">Tomorrow ›</button>
        </div>
    </div>
</body>

    <script>
 // Create a container for the chatbot
 const chatbotContainer = document.createElement('div');
 chatbotContainer.id = 'chatbot-container';

 // Create an iframe for the chatbot
 const chatbotIframe = document.createElement('iframe');
 chatbotIframe.id = 'chatbot-iframe';
 chatbotIframe.src = 'https://tech-mate-chatbot.vercel.app';
 chatbotIframe.frameBorder = '0';

 // Append the iframe to the container
 chatbotContainer.appendChild(chatbotIframe);
 // Append the container to the body of the document
 document.body.appendChild(chatbotContainer);

 // Create a style element to contain CSS rules
 const style = document.createElement('style');
 style.textContent = `
     #chatbot-container {
         position: fixed;
         top: 0;
         left: 0;
         width: 100%;
         height: 100%;
         pointer-events: none;
     }

     #chatbot-iframe {
         position: absolute;
         bottom: 10px;
         right: 10px;
         width: 50px; /* Default width */
         height: 50px; /* Default height */
         border-radius: 16px;
         z-index: 100000;
         pointer-events: auto;
         transition: width 0.3s ease, height 0.3s ease; /* Smooth transition */
     }

     @media (max-width: 600px) {
         #chatbot-iframe {
             width: 100%;
             height: 100%;
             bottom: 0;
             right: 0;
             border-radius: 0;
         }
     }
 `;
 // Append the style element to the head of the document
 document.head.appendChild(style);

 // Listen for messages from the iframe
 window.addEventListener('message', (event) => {
     // Verify the origin of the message
     if (event.origin !== 'https://tech-mate-chatbot.vercel.app') {
         return;
     }

     // Verify the type of the message
     if (event.data.type !== "chatbot-dimensions") {
         console.warn('Ignored message:', event.data);
         return;
     }

     // Extract dimensions and chat state from the message data
     const { width, height, isChatClosed } = event.data;

     // Adjust iframe dimensions based on the message data
     if (window.innerWidth < 574 && !isChatClosed) {
         chatbotIframe.style.width = '100%';
         chatbotIframe.style.height = '100%';
         chatbotIframe.style.bottom = '0';
         chatbotIframe.style.right = '0';
         chatbotIframe.style.borderRadius = '0';
     } else if (width && height) {
         chatbotIframe.style.width = width;
         chatbotIframe.style.height = height;
     }
 });
</script>

</html>
